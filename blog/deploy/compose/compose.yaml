name: jikji-blog
services:
  ghost:
    image: ${GHOST_IMAGE:?Set GHOST_IMAGE}
    build:
      context: ../..
      dockerfile: deploy/images/Ghost.Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:${GHOST_BIND_PORT:-2368}:2368"
    environment:
      GHOST_URL: ${GHOST_URL:?Set GHOST_URL}
      DB_HOST: ${DB_HOST:?Set DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
    volumes:
      - content:/var/lib/ghost/content
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  content:
