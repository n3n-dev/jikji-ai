apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: ghost}
spec:
  ingressClassName: replace-with-your-ingress-class
  tls:
    - hosts: [example.com]
      secretName: ghost-tls
  rules:
    - host: example.com
      http:
        paths:
          - path: /blog
            pathType: Prefix
            backend:
              service: {name: ghost, port: {number: 2368}}
          # Optional metrics: add /views (Exact) -> ghost-metrics:2369.
          # Preserve the /blog prefix. Do not add a rewrite-target annotation.
