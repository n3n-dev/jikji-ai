apiVersion: v1
kind: Service
metadata: {name: mysql}
spec:
  clusterIP: None
  selector: {app: jikji-ghost-mysql}
  ports: [{name: mysql, port: 3306, targetPort: 3306}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mysql}
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app: jikji-ghost-mysql}
  template:
    metadata:
      labels: {app: jikji-ghost-mysql}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:8.0
          ports: [{name: mysql, containerPort: 3306}]
          env:
            - name: MYSQL_DATABASE
              valueFrom: {configMapKeyRef: {name: ghost-config, key: DB_NAME}}
            - name: MYSQL_USER
              valueFrom: {configMapKeyRef: {name: ghost-config, key: DB_USER}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: ghost-secrets, key: DB_PASSWORD}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: ghost-secrets, key: MYSQL_ROOT_PASSWORD}}
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          startupProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
            periodSeconds: 15
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 20Gi}
