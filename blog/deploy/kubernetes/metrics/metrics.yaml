apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: ghost-metrics}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata: {name: ghost-metrics}
spec:
  selector: {app: jikji-ghost-metrics}
  ports: [{name: http, port: 2369, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ghost-metrics}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: jikji-ghost-metrics}
  template:
    metadata:
      labels: {app: jikji-ghost-metrics}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true}
      containers:
        - name: metrics
          image: jikji-blog-metrics:1
          ports: [{name: http, containerPort: 2369}]
          env:
            - name: GHOST_URL
              valueFrom: {configMapKeyRef: {name: ghost-config, key: GHOST_URL}}
            - name: BLOG_ORIGIN
              valueFrom: {configMapKeyRef: {name: ghost-config, key: BLOG_ORIGIN}}
            - name: GHOST_CONTENT_API_KEY
              valueFrom: {secretKeyRef: {name: ghost-metrics-secret, key: GHOST_CONTENT_API_KEY}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 30}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ghost-metrics}
