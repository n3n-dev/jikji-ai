# Include INSIDE the existing HTTPS server block for the public domain.
# Keep the existing company website's / upstream unchanged.
# These loopback upstreams are for Compose on the same host as NGINX.
location = /blog {
    return 301 /blog/;
}
location ^~ /blog/ {
    # No trailing slash: Ghost receives the /blog prefix configured in GHOST_URL.
    proxy_pass http://127.0.0.1:2368;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 50m;
    proxy_read_timeout 90s;
}
