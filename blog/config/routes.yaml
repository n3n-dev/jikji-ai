routes:
  /:
    controller: channel
    template: home
    filter: primary_tag:[blog,news]

collections:
  /blog/:
    permalink: /blog/{slug}/
    template: blog
    filter: primary_tag:blog
  /news/:
    permalink: /news/{slug}/
    template: news
    filter: primary_tag:news

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
