name: Build and Deploy to K8s

on:
  push:
    branches: [develop, main]

env:
  IMAGE_NAME: ghcr.io/n3n-dev/jikji-ai
  NAMESPACE: jikji-ai
  APP_NAME: jikji-ai

jobs:
  # 1. 빌드 단계: GitHub 서버에서 빠르게 빌드 후 푸시
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64 # 서버 환경에 맞춤
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  # 2. 배포 단계: org ARC 러너(d2 클러스터 내 ephemeral Pod)에서 kubectl 실행
  deploy:
    needs: build-and-push
    runs-on: arc-runner-set
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Resolve target env
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "env=d2" >> "$GITHUB_OUTPUT"
            echo "manifest=k8s/combined.yaml" >> "$GITHUB_OUTPUT"
            echo "app_name=jikji-ai-dev" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "manifest=k8s/combined-prod.yaml" >> "$GITHUB_OUTPUT"
            echo "app_name=jikji-ai" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown ref: ${{ github.ref }}" >&2
            exit 1
          fi

      - name: Write kubeconfig
        env:
          KUBECONFIG_D2: ${{ secrets.KUBECONFIG_D2 }}
          KUBECONFIG_PROD: ${{ secrets.KUBECONFIG_PROD }}
          CONTEXT: ${{ steps.target.outputs.env }}
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          if [ "$CONTEXT" = "d2" ]; then
            echo "$KUBECONFIG_D2" | base64 -d > "$RUNNER_TEMP/.kube/config"
          elif [ "$CONTEXT" = "prod" ]; then
            echo "$KUBECONFIG_PROD" | base64 -d > "$RUNNER_TEMP/.kube/config"
          else
            echo "Unknown CONTEXT: $CONTEXT" >&2; exit 1
          fi
          chmod 600 "$RUNNER_TEMP/.kube/config"

      - name: Deploy
        env:
          KUBECONFIG: ${{ runner.temp }}/.kube/config
          CONTEXT: ${{ steps.target.outputs.env }}
          MANIFEST: ${{ steps.target.outputs.manifest }}
          APP_NAME: ${{ steps.target.outputs.app_name }}
        run: |
          kubectl --context "$CONTEXT" -n $NAMESPACE apply -f "$MANIFEST"
          kubectl --context "$CONTEXT" -n $NAMESPACE set image \
            deployment/$APP_NAME \
            $APP_NAME=$IMAGE_NAME:sha-${{ github.sha }}
          kubectl --context "$CONTEXT" -n $NAMESPACE rollout status \
            deployment/$APP_NAME --timeout=120s

      - name: Rollback on failure
        if: failure()
        env:
          KUBECONFIG: ${{ runner.temp }}/.kube/config
          CONTEXT: ${{ steps.target.outputs.env }}
          APP_NAME: ${{ steps.target.outputs.app_name }}
        run: |
          kubectl --context "$CONTEXT" -n $NAMESPACE rollout undo deployment/$APP_NAME || true
          exit 1
