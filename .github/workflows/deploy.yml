name: Build and Deploy to K8s

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/n3n-dev/jikji-homepage
  NAMESPACE: homepage-jikji.ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to K8s
        run: |
          # 이미지 태그 업데이트 및 배포
          kubectl -n ${{ env.NAMESPACE }} set image \
            deployment/jikji-homepage \
            jikji-homepage=${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          
          # 전체 매니페스트 적용 (필요시)
          kubectl apply -f k8s/ -n ${{ env.NAMESPACE }}
          
          # 배포 상태 확인
          kubectl -n ${{ env.NAMESPACE }} rollout status deployment/jikji-homepage --timeout=120s
