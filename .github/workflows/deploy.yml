name: Build and Deploy to K8s

on:
  push:
    branches: [main] # main merge → dev(d3) 배포
    tags: ['v*'] # 릴리즈 태그 → 이미지 버전 태깅 + prod 배포

env:
  IMAGE_NAME: ghcr.io/n3n-dev/jikji-ai
  NAMESPACE: jikji-ai
  APP_NAME: jikji-ai

jobs:
  # 1. 빌드 단계: GitHub 서버에서 빠르게 빌드 후 푸시
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: meta
        run: |
          case "$GITHUB_REF" in
            refs/heads/main)
              tags="$IMAGE_NAME:latest,$IMAGE_NAME:sha-$GITHUB_SHA"
              ;;
            refs/tags/v*)
              tags="$IMAGE_NAME:$GITHUB_REF_NAME,$IMAGE_NAME:sha-$GITHUB_SHA"
              ;;
            *)
              echo "Unknown ref: $GITHUB_REF" >&2
              exit 1
              ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64 # 서버 환경에 맞춤
          tags: ${{ steps.meta.outputs.tags }}

  # 2. 배포 단계: org ARC 러너에서 d3/prod 클러스터로 배포
  deploy:
    needs: build-and-push
    runs-on: d3-runner
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Resolve target env
        id: target
        run: |
          case "$GITHUB_REF" in
            refs/heads/main)
              env_name=d3
              manifest=k8s/combined.yaml
              app_name=jikji-ai
              image_tag=sha-$GITHUB_SHA
              ;;
            refs/tags/v*)
              env_name=prod
              manifest=k8s/combined-prod.yaml
              app_name=jikji-ai
              image_tag=$GITHUB_REF_NAME
              ;;
            *)
              echo "Unknown ref: $GITHUB_REF" >&2
              exit 1
              ;;
          esac

          {
            echo "env=$env_name"
            echo "manifest=$manifest"
            echo "app_name=$app_name"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Write kubeconfig
        env:
          KUBECONFIG_D3: ${{ secrets.KUBECONFIG_D3 }}
          KUBECONFIG_PROD: ${{ secrets.KUBECONFIG_PROD }}
          CONTEXT: ${{ steps.target.outputs.env }}
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          if [ "$CONTEXT" = "d3" ]; then
            echo "$KUBECONFIG_D3" | base64 -d > "$RUNNER_TEMP/.kube/config"
          elif [ "$CONTEXT" = "prod" ]; then
            echo "$KUBECONFIG_PROD" | base64 -d > "$RUNNER_TEMP/.kube/config"
          else
            echo "Unknown CONTEXT: $CONTEXT" >&2; exit 1
          fi
          chmod 600 "$RUNNER_TEMP/.kube/config"

      - name: Deploy
        env:
          KUBECONFIG: ${{ runner.temp }}/.kube/config
          CONTEXT: ${{ steps.target.outputs.env }}
          MANIFEST: ${{ steps.target.outputs.manifest }}
          APP_NAME: ${{ steps.target.outputs.app_name }}
          IMAGE_TAG: ${{ steps.target.outputs.image_tag }}
        run: |
          sed "s|image: $IMAGE_NAME:latest|image: $IMAGE_NAME:$IMAGE_TAG|" "$MANIFEST" |
            kubectl --context "$CONTEXT" -n "$NAMESPACE" apply -f -
          kubectl --context "$CONTEXT" -n "$NAMESPACE" rollout status \
            "deployment/$APP_NAME" --timeout=120s
          if [ "$CONTEXT" = "d3" ]; then
            kubectl --context "$CONTEXT" -n "$NAMESPACE" delete \
              ingress/jikji-ai-dev-ingress \
              service/jikji-ai-dev-svc \
              deployment/jikji-ai-dev \
              --ignore-not-found
          fi

      - name: Rollback on failure
        if: failure()
        env:
          KUBECONFIG: ${{ runner.temp }}/.kube/config
          CONTEXT: ${{ steps.target.outputs.env }}
          APP_NAME: ${{ steps.target.outputs.app_name }}
        run: |
          kubectl --context "$CONTEXT" -n "$NAMESPACE" rollout undo "deployment/$APP_NAME" || true
          exit 1
