name: Build and Deploy to K8s

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/n3n-dev/jikji-homepage
  NAMESPACE: homepage-jikji-ai

jobs:
  # 1. 빌드 단계: GitHub 서버에서 빠르게 빌드 후 푸시
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64 # 서버 환경에 맞춤
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  # 2. 배포 단계: 내부망에 접근 가능한 서버에서 kubectl 실행
  deploy:
    needs: build-and-push
    runs-on: self-hosted # 내부망 서버에 설치된 러너가 담당
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0' # 클러스터 버전에 맞춰 설치

      - name: Deploy to K8s
        run: |
          # 이미지 태그 업데이트 (새로운 SHA 태그 사용)
          kubectl -n ${{ env.NAMESPACE }} set image \
            deployment/jikji-homepage \
            jikji-homepage=${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

          # 전체 설정 동기화
          kubectl apply -f k8s/combined.yaml -n ${{ env.NAMESPACE }}

          # 배포 완료 대기
          kubectl -n ${{ env.NAMESPACE }} rollout status deployment/jikji-homepage --timeout=120s

