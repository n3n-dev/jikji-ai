name: Validate Ghost theme

on:
  pull_request:
    paths:
      - 'blog/**'
      - '.github/workflows/blog-theme.yml'
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - '.github/workflows/blog-theme.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - run: npm ci
      - run: npm test
      - run: docker compose config --quiet
      - run: npm run check:theme
      - run: node --check theme/assets/js/content.js
      - run: npm run package:theme
      - uses: actions/upload-artifact@v4
        with:
          name: jikji-blog-theme
          path: blog/dist/*.zip
