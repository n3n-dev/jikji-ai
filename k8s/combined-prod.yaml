apiVersion: v1
kind: Namespace
metadata:
  name: homepage-jikji-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jikji-homepage
  namespace: homepage-jikji-ai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: jikji-homepage
  template:
    metadata:
      labels:
        app: jikji-homepage
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: jikji-homepage
          image: ghcr.io/n3n-dev/jikji-homepage:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: jikji-homepage-svc
  namespace: homepage-jikji-ai
spec:
  selector:
    app: jikji-homepage
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jikji-homepage-ingress
  namespace: homepage-jikji-ai
spec:
  ingressClassName: traefik
  rules:
    - host: homepage-jikji-ai.prod.nthreen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jikji-homepage-svc
                port:
                  number: 80
