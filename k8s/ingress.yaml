apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jikji-ai-ingress
  namespace: jikji-ai
  annotations:
    kubernetes.io/ingress.class: 'nginx'
spec:
  rules:
    - host: jikji.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jikji-ai-svc
                port:
                  number: 80
